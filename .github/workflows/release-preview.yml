name: release

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, labeled]

permissions: {}

jobs:
  pkg-pr-new:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true
          install: false

      - name: 📦 install dependencies
        run: pnpm install

      - name: 🛠 build project
        run: pnpm build

      - name: 📦 publish nightly release
        run: pnpm pkg-pr-new publish --compact packages/nuxt-cos packages/vite-plugin-cross-origin-storage
